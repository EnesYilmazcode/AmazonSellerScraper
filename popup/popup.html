<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>ProScan</title>
    <link rel="stylesheet" href="popup.css">
    <script src="../libs/xlsx.full.min.js"></script>
    <script src="../scripts/modules/price.js"></script>
    <script src="../scripts/lib/parsers.js"></script>
    <script src="../scripts/lib/messages.js"></script>
    <script src="../scripts/lib/run.js"></script>
    <script src="../scripts/lib/flags.js"></script>
    <script src="../scripts/lib/page-kind.js"></script>
    <script src="../scripts/modules/storage.js"></script>
    <script src="../scripts/modules/analyzer.js"></script>
    <script src="../scripts/modules/spread-analyzer.js"></script>
    <script src="../scripts/modules/exporter.js"></script>
</head>
<body>
    <header class="top">
        <span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6.5" cy="15.5" r="3.5"/><circle cx="17.5" cy="15.5" r="3.5"/><path d="M4 13 6 5.5h3L10 12"/><path d="M20 13 18 5.5h-3L14 12"/><path d="M10 14.5h4"/></svg></span>
        <span class="name">ProScan</span>
        <span class="version" id="version"></span>
    </header>

    <main>
        <!-- This tab: what it is, and Scrape when it can be scraped -->
        <section class="here" aria-labelledby="hereTitle">
            <h1 id="hereTitle">Open a search or a storefront</h1>
            <p id="hereSub" class="hidden"></p>
            <div class="status hidden" id="status" role="status"></div>
            <button id="reloadTabButton" class="secondary hidden">Reload the tab and start</button>
            <button id="actionButton" class="primary hidden">Scrape</button>
        </section>

        <!-- The latest run and its downloads -->
        <section class="last hidden" id="lastScrape" aria-labelledby="lastTitle">
            <div class="last-top">
                <h2 id="lastTitle">Last scrape</h2>
                <span id="lastSource"></span>
            </div>
            <div class="big" id="lastBig"><b id="itemCount">0</b> <span id="itemWord">products</span></div>
            <div class="ticks" id="lastTicks" aria-hidden="true"></div>
            <div class="dl hidden" id="exportButtons">
                <div class="dl-row">
                    <button id="downloadExcel" class="primary dl-main"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2.5v8M4.5 7 8 10.5 11.5 7M3 13.5h10"/></svg> Download Excel</button>
                    <button id="downloadMore" class="primary dl-more" aria-label="Other formats" aria-expanded="false" aria-controls="downloadMenu"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg></button>
                </div>
                <div class="menu hidden" id="downloadMenu">
                    <button id="downloadCSV">CSV</button>
                    <button id="downloadJSON">JSON</button>
                </div>
            </div>

            <!-- Compare seller prices stays hidden: Amazon's current offer pages broke it (audit F-30). -->
            <button id="spreadButton" class="secondary hidden">Compare seller prices</button>

            <button id="exportToProScanBtn" class="secondary hidden">Send to dashboard</button>
        </section>

        <!-- Settings: the AI key and the optional account stay here, never on Amazon -->
        <section class="settings" aria-label="Settings">
            <details class="fold" id="aiSettings">
                <summary><b>Gemini key</b><span class="state" id="aiKeySummary">Not set</span></summary>
                <div class="fold-body">
                    <label class="sr" for="geminiKeyInput">Gemini API key</label>
                    <input type="password" id="geminiKeyInput" class="field" placeholder="Paste your Gemini API key" autocomplete="off" spellcheck="false">
                    <div class="row">
                        <button id="geminiKeySave" class="secondary">Save</button>
                        <button id="geminiKeyClear" class="quiet hidden">Remove</button>
                        <a class="get" href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Get a free key</a>
                    </div>
                    <div class="help" id="geminiKeyStatus" role="status"></div>
                </div>
            </details>

            <details class="fold hidden" id="authPanel">
                <summary><b id="authSummary">Dashboard sync</b><span class="state" id="authSummarySub">Off</span></summary>
                <div class="fold-body">
                    <div class="auth-form" id="authForm">
                        <div class="notice hidden" id="authNotice"></div>
                        <button id="authGoogleBtn" class="secondary">Continue with Google</button>
                        <button type="button" id="authEmailToggle" class="quiet">Use email instead</button>
                        <div class="auth-form hidden" id="authEmailForm">
                            <label class="sr" for="authEmail">Email</label>
                            <input type="email" id="authEmail" class="field" placeholder="Email" autocomplete="username">
                            <label class="sr" for="authPassword">Password</label>
                            <input type="password" id="authPassword" class="field" placeholder="Password" autocomplete="current-password">
                            <button id="authSignInBtn" class="secondary">Sign in</button>
                            <div class="row">
                                <a id="authSignUpLink" href="https://proscanbot.web.app/dashboard/" target="_blank" rel="noopener">Create an account</a>
                                <button type="button" id="authResetBtn" class="quiet">Forgot password?</button>
                            </div>
                        </div>
                        <div class="notice error hidden" id="authError" role="alert"></div>
                    </div>
                    <div class="auth-account hidden" id="authAccount">
                        <span class="auth-account-email" id="authStatusEmail"></span>
                        <button id="authSignOutBtn" class="quiet">Sign out</button>
                    </div>
                    <div class="help hidden" id="authSync"></div>
                </div>
            </details>
        </section>
    </main>
    <script src="ai-key.js"></script>
    <script src="popup.js"></script>
</body>
</html>
