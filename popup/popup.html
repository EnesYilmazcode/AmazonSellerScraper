<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="popup.css">
    <script src="../libs/xlsx.full.min.js"></script>
    <script src="../scripts/modules/price.js"></script>
    <script src="../scripts/lib/parsers.js"></script>
    <script src="../scripts/lib/run.js"></script>
    <script src="../scripts/lib/flags.js"></script>
    <script src="../scripts/modules/storage.js"></script>
    <script src="../scripts/modules/analyzer.js"></script>
    <script src="../scripts/modules/spread-analyzer.js"></script>
    <script src="../scripts/modules/exporter.js"></script>
</head>
<body>
    <div class="card">
        <img src="../assets/icons/icon128.png" alt="ProScan Logo" class="logo">
        <h1>ProScan</h1>

        <!-- Quick Stats Dashboard -->
        <div class="dashboard">
            <div class="stat-row">
                <div class="stat">
                    <div class="stat-value" id="itemCount">0</div>
                    <div class="stat-label"><i class="fas fa-box"></i> Items</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="avgRating">-</div>
                    <div class="stat-label"><i class="fas fa-star"></i> Avg Rating</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="avgPrice">-</div>
                    <div class="stat-label"><i class="fas fa-dollar-sign"></i> Avg Price</div>
                </div>
            </div>
        </div>

        <!-- Insights Preview -->
        <div class="insights-preview hidden" id="insightsPreview">
            <div class="insight-badge" id="insightBadge">
                <i class="fas fa-lightbulb"></i>
                <span id="insightText">No insights yet</span>
            </div>
        </div>

        <!-- ProScan Cloud Auth -->
        <div class="auth-panel hidden" id="authPanel">
            <!-- Signed-out: sign-in form -->
            <div class="auth-form" id="authForm">
                <div class="auth-title">
                    <i class="fas fa-cloud"></i> Sign in to ProScan
                </div>
                <input type="email" id="authEmail" class="auth-input" placeholder="Email" autocomplete="username">
                <input type="password" id="authPassword" class="auth-input" placeholder="Password" autocomplete="current-password">
                <button id="authSignInBtn" class="auth-button">
                    <i class="fas fa-right-to-bracket"></i> Sign in to ProScan
                </button>
                <div class="auth-error hidden" id="authError"></div>
            </div>

            <!-- Signed-in: account state -->
            <div class="auth-account hidden" id="authAccount">
                <div class="auth-account-info">
                    <i class="fas fa-circle-user"></i>
                    <span class="auth-account-email" id="authStatusEmail"></span>
                </div>
                <button id="authSignOutBtn" class="auth-signout">
                    <i class="fas fa-right-from-bracket"></i> Sign out
                </button>
            </div>
        </div>

        <!-- AI chat settings: the user's own Gemini key -->
        <details class="auth-panel ai-settings" id="aiSettings">
            <summary class="auth-title">
                <i class="fas fa-robot"></i> AI chat settings
            </summary>
            <input type="password" id="geminiKeyInput" class="auth-input" placeholder="Paste your Gemini API key" autocomplete="off" spellcheck="false">
            <div class="ai-key-actions">
                <button id="geminiKeySave" class="auth-button">
                    <i class="fas fa-key"></i> Save key
                </button>
                <button id="geminiKeyClear" class="auth-signout hidden">Remove</button>
            </div>
            <div class="ai-key-status" id="geminiKeyStatus"></div>
            <div class="ai-key-help">
                Get a free key at <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a>.
                It stays on this computer and is sent only to Google.
            </div>
        </details>

        <div class="status" id="status">
            <i class="fas fa-info-circle"></i> Ready to start
        </div>

        <button id="reloadTabButton" class="spread-button hidden">
            <i class="fas fa-rotate-right"></i> Reload the tab and start
        </button>

        <button id="actionButton" class="primary-button">
            <i class="fas fa-play"></i> Start Scraping
        </button>

        <!-- Spread Analysis -->
        <button id="spreadButton" class="spread-button hidden">
            <i class="fas fa-chart-bar"></i> Analyze Price Spreads
        </button>

        <div id="spreadProgress" class="spread-progress hidden">
            <div class="spread-progress-bar">
                <div class="spread-progress-fill" id="spreadProgressFill"></div>
            </div>
            <span class="spread-progress-text" id="spreadProgressText">0/0</span>
        </div>

        <div id="spreadResults" class="spread-results hidden">
            <div class="spread-stats">
                <div class="spread-stat">
                    <span class="spread-stat-value" id="spreadHighCount">0</span>
                    <span class="spread-stat-label">High Spread</span>
                </div>
                <div class="spread-stat">
                    <span class="spread-stat-value" id="spreadAvgCV">0%</span>
                    <span class="spread-stat-label">Avg CV</span>
                </div>
            </div>
        </div>

        <!-- Export Options -->
        <div class="export-buttons hidden" id="exportButtons">
            <button id="downloadExcel" class="download-button">
                <i class="fas fa-file-excel"></i> Excel
            </button>
            <button id="downloadCSV" class="download-button secondary">
                <i class="fas fa-file-csv"></i> CSV
            </button>
            <button id="downloadJSON" class="download-button secondary">
                <i class="fas fa-file-code"></i> JSON
            </button>
        </div>

        <!-- Cloud export -->
        <button id="exportToProScanBtn" class="export-cloud-button hidden">
            <i class="fas fa-cloud-arrow-up"></i> Export to ProScan
        </button>

    </div>
    <script src="ai-key.js"></script>
    <script src="popup.js"></script>
</body>
</html>
